name: AISHA Core CI

on:
  push:
    branches: [main, feature/semantic-recall-v1]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: services/aisha-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/aisha-core/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          AISHA_PROFILE: mock
        run: pytest -q
      - name: Static checks
        run: ruff check aisha tests scripts

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aisha-studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/aisha-studio/.node-version
      - name: Install
        run: npm install
      - name: Typecheck and build
        run: npm run build

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell development scripts
        shell: pwsh
        run: |
          $files = @(
            "Start-AISHA.ps1",
            "infrastructure/scripts/bootstrap_windows.ps1",
            "infrastructure/scripts/start_windows_dev.ps1"
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$file has PowerShell parse errors: $($errors -join '; ')"
            }
          }
          if ($failed) {
            exit 1
          }
