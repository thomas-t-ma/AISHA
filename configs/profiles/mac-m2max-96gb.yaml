name: mac-m2max-96gb
compute:
  class: apple-silicon-high-memory
  chip: Apple M2 Max
  unified_memory_gb: 96
llm:
  provider: ollama
  model: qwen3.5:35b-mlx
  base_url: http://127.0.0.1:11434
  api_key_env: null
  think: false
  preload: true
  keep_alive: 30m
  options:
    num_ctx: 32768
memory:
  semantic_recall: true
  embedding_model: qwen3-embedding:0.6b
  embedding_base_url: http://127.0.0.1:11434
  embedding_keep_alive: 30m
  semantic_threshold: 0.72
  semantic_limit: 2
stt:
  provider: disabled
  planned_provider: mlx-whisper
tts:
  provider: disabled
  planned_provider: kokoro-local
vision:
  provider: disabled
notes: >-
  Primary AISHA development profile for the M2 Max / 96 GB Mac. Conversational
  turns disable model thinking for latency and preload the model when AISHA Core
  starts. Future planning/reasoning tasks may opt into a separate thinking role.
